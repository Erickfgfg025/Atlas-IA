[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "atlas-ai"
version = "0.1.0"
description = "ATLAS AI desktop assistant for Windows 10/11"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "pydantic-settings==2.9.1",
  "google-genai==1.16.1",
  "supabase==2.15.1",
  "PySide6==6.9.0",
  "httpx==0.28.1",
  "keyring==25.6.0",
  "python-multipart==0.0.20",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-cov==6.1.1", "pytest-asyncio==1.3.0", "ruff==0.11.9"]

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
