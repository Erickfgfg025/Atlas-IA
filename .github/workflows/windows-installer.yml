name: Windows installer

on:
  push:
    branches: [main]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-installer:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install application and packaging tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller==6.16.0

      - name: Build Windows application bundle
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir `
            --name "AtlasAI" `
            --paths "src" `
            --runtime-hook "build/windows/runtime_hook.py" `
            --collect-all PySide6 `
            --collect-all shiboken6 `
            --hidden-import "atlas.desktop.memories_dialog" `
            --hidden-import "atlas.desktop.voice_orb" `
            "src/atlas/desktop/app.py"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Create installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/installer" | Out-Null
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) was not found."
          }
          & $iscc "build/windows/atlas-ai.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE."
          }

      - name: Verify installer output
        shell: pwsh
        run: |
          $installer = Get-ChildItem "dist/installer" -Filter "*.exe" -File
          if (-not $installer) {
            throw "No installer .exe was produced."
          }
          Get-FileHash $installer.FullName -Algorithm SHA256 | Format-List

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-ai-windows-installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
