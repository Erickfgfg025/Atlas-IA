services:
  - type: web
    name: atlas-ai-api
    runtime: python
    plan: free
    buildCommand: pip install .
    startCommand: uvicorn atlas.backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ATLAS_ENVIRONMENT
        value: production
      - key: ATLAS_API_HOST
        value: 0.0.0.0
      - key: ATLAS_MEMORY_BACKEND
        value: supabase
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: FISH_AUDIO_API_KEY
        sync: false
      - key: FISH_AUDIO_REFERENCE_ID
        sync: false
      - key: FISH_AUDIO_MODEL
        value: s2.1-pro-free
      - key: ATLAS_MAX_AUDIO_UPLOAD_MB
        value: "20"
      - key: HERMES_AGENT_ENABLED
        value: "false"
      - key: HERMES_AGENT_PATH
        sync: false
      - key: HERMES_AGENT_MODEL
        sync: false
      - key: HERMES_AGENT_TASK_TIMEOUT_SECONDS
        value: "90"
